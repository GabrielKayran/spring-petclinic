<text fill="#5C7280" font-family="DejaVu Sans" font-size="15" x="469" y="668">actuator restrito a health e info</text>

<!-- Nó Neon -->
<rect fill="#F8FBFA" height="330" rx="25" stroke="#3A718E" stroke-width="2.5" width="340" x="1310" y="105" />
