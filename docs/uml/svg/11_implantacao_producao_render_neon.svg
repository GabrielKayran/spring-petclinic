<text fill="#5C7280" font-family="DejaVu Sans" font-size="15" x="874" y="460">VeterinarioGrpcService</text>

<rect fill="#F3F8F9" height="140" rx="14" stroke="#BFD0D6" stroke-width="2" width="765" x="450" y="560" />
