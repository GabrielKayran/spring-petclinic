<text fill="#162C35" font-family="DejaVu Sans" font-size="19" font-weight="bold" x="1354" y="232">PostgreSQL 18</text>
<text fill="#5C7280" font-family="DejaVu Sans" font-size="15" x="1354" y="262">banco neondb</text>
<text fill="#5C7280" font-family="DejaVu Sans" font-size="15" x="1354" y="287">endpoint com pooler</text>
<text fill="#5C7280" font-family="DejaVu Sans" font-size="15" x="1354" y="312">sslmode=require</text>
<text fill="#5C7280" font-family="DejaVu Sans" font-size="15" x="1354" y="337">schema/data idempotentes</text>

<!-- Variáveis -->
<rect fill="#FFFFFF" height="250" rx="14" stroke="#BFD0D6" stroke-dasharray="6,5" stroke-width="2" width="340" x="1310" y="470" />
