// Contrato gRPC da Extensão 1 (equivalente moderno da interface remota do RMI).
// Diferente do RMI, o contrato é neutro de linguagem: com este mesmo arquivo dá para
// gerar cliente e servidor em Java, C#, Python, Go etc.
// O protobuf-maven-plugin gera as classes Java na fase generate-sources do Maven.
syntax = "proto3";

package petclinic;

option java_multiple_files = true;
option java_package = "org.springframework.samples.petclinic.grpc.proto";
option java_outer_classname = "VeterinariosProto";

// Serviço remoto: equivale à interface VeterinarioService da demo RMI
service VeterinarioService {
  rpc ListarVeterinarios (ListarVeterinariosRequest) returns (ListarVeterinariosResponse);
}

// Requisição vazia por enquanto. Ter uma mensagem própria permite incluir filtros
// no futuro sem quebrar os clientes antigos.
message ListarVeterinariosRequest {
}

message Veterinario {
  int32 id = 1;
  string nome = 2;
  string sobrenome = 3;
  repeated string especialidades = 4;
}

message ListarVeterinariosResponse {
  repeated Veterinario veterinarios = 1;
}
