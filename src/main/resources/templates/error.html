<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'error')}">

<body>
  <div class="error-box">
    <img class="error-image" src="../static/resources/images/pets.png" th:src="@{/resources/images/pets.png}"
      alt="" />
    <div>
      <h2 th:text="#{somethingHappened}">Something happened...</h2>

      <p th:switch="${status}" class="lead-text">
        <span th:case="404" th:text="#{error.404}">The requested page was not found.</span>
        <span th:case="500" th:text="#{error.500}">An internal server error occurred.</span>
        <span th:case="*" th:text="#{error.general}">An unexpected error occurred.</span>
      </p>

      <details class="error-details" th:if="${message}">
        <summary th:text="#{technicalDetails}">Technical details</summary>
        <p th:text="${message}">Exception message</p>
      </details>

      <a class="btn btn-primary" th:href="@{/}" th:text="#{backHome}">Back to home</a>
    </div>
  </div>
</body>

</html>
