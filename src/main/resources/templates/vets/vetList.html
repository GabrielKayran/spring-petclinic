<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <div class="page-head">
    <h2 th:text="#{vets}">Veterinarians</h2>
  </div>

  <div class="sheet sheet-flush">
    <table id="vets" class="table stack-table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{specialties}">Specialties</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="vet : ${listVets}">
          <td th:attr="data-label=#{name}" th:text="${vet.firstName + ' ' + vet.lastName}"></td>
          <td th:attr="data-label=#{specialties}">
            <span>
              <span class="specialty" th:each="specialty : ${vet.specialties}"
                th:text="${#messages.msgOrNull('specialty.' + specialty.name) ?: specialty.name}">surgery</span>
              <span class="text-muted" th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${totalPages > 1}" th:aria-label="#{pages}">
    <ul class="pagination">
      <li th:class="${currentPage > 1 ? 'page-item' : 'page-item disabled'}">
        <a class="page-link" th:href="@{/vets.html(page=${currentPage - 1})}" th:title="#{previous}">
          <span class="fa fa-angle-left" aria-hidden="true"></span>
        </a>
      </li>
      <li th:each="i: ${#numbers.sequence(1, totalPages)}"
        th:class="${currentPage == i ? 'page-item active' : 'page-item'}">
        <a class="page-link" th:href="@{/vets.html(page=${i})}" th:text="${i}">1</a>
      </li>
      <li th:class="${currentPage < totalPages ? 'page-item' : 'page-item disabled'}">
        <a class="page-link" th:href="@{/vets.html(page=${currentPage + 1})}" th:title="#{next}">
          <span class="fa fa-angle-right" aria-hidden="true"></span>
        </a>
      </li>
    </ul>
  </nav>
</body>

</html>
