<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="page-head">
    <h2 th:text="#{owners}">Owners</h2>
    <a class="btn btn-outline-secondary" th:href="@{/owners/find}" th:text="#{findOwner}">Find</a>
  </div>

  <div class="sheet sheet-flush">
    <table id="owners" class="table stack-table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{address}">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${listOwners}">
          <td th:attr="data-label=#{name}">
            <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
          </td>
          <td th:attr="data-label=#{address}" th:text="${owner.address}"></td>
          <td th:attr="data-label=#{city}" th:text="${owner.city}"></td>
          <td th:attr="data-label=#{telephone}" class="nowrap" th:text="${owner.telephone}"></td>
          <td th:attr="data-label=#{pets}" th:text="${#strings.listJoin(owner.pets, ', ')}"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${totalPages > 1}" th:aria-label="#{pages}">
    <ul class="pagination">
      <li th:class="${currentPage > 1 ? 'page-item' : 'page-item disabled'}">
        <a class="page-link" th:href="@{/owners(page=${currentPage - 1})}" th:title="#{previous}">
          <span class="fa fa-angle-left" aria-hidden="true"></span>
        </a>
      </li>
      <li th:each="i: ${#numbers.sequence(1, totalPages)}"
        th:class="${currentPage == i ? 'page-item active' : 'page-item'}">
        <a class="page-link" th:href="@{/owners(page=${i})}" th:text="${i}">1</a>
      </li>
      <li th:class="${currentPage < totalPages ? 'page-item' : 'page-item disabled'}">
        <a class="page-link" th:href="@{/owners(page=${currentPage + 1})}" th:title="#{next}">
          <span class="fa fa-angle-right" aria-hidden="true"></span>
        </a>
      </li>
    </ul>
  </nav>
</body>

</html>
