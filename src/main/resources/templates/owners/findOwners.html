<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="page-head">
    <h2 th:text="#{findOwners}">Owners</h2>
    <a class="btn btn-outline-secondary" th:href="@{/owners/new}">
      <span class="fa fa-plus" aria-hidden="true"></span> <span th:text="#{addOwner}">Add Owner</span>
    </a>
  </div>

  <form th:object="${owner}" th:action="@{/owners}" method="get" class="sheet search-form" id="search-owner-form">
    <label for="lastName" class="form-label" th:text="#{lastName}">Last name</label>
    <div class="search-row">
      <input class="form-control" th:errorclass="is-invalid" th:field="*{lastName}" maxlength="80"
        autocomplete="off" />
      <button type="submit" class="btn btn-primary" th:text="#{findOwner}">Find Owner</button>
    </div>
    <div class="invalid-feedback d-block" th:if="${#fields.hasAnyErrors()}">
      <p th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</p>
    </div>
    <p class="form-hint" th:unless="${#fields.hasAnyErrors()}" th:text="#{searchHint}">Leave blank to list every
      owner.</p>
  </form>

</body>

</html>
