<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div th:if="${message}" class="alert alert-success flash" id="success-message" role="status">
    <span th:text="#{${message}}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger flash" id="error-message" role="alert">
    <span th:text="#{${error}}"></span>
  </div>

  <div class="page-head" th:object="${owner}">
    <div>
      <p class="eyebrow" th:text="#{ownerInformation}">Owner Information</p>
      <h2 th:text="*{firstName + ' ' + lastName}">George Franklin</h2>
    </div>
    <div class="button-row">
      <a th:href="@{__${owner.id}__/edit}" class="btn btn-outline-secondary" th:text="#{editOwner}">Edit Owner</a>
      <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add New Pet</a>
    </div>
  </div>

  <dl class="sheet facts" th:object="${owner}">
    <div>
      <dt th:text="#{address}">Address</dt>
      <dd th:text="*{address}"></dd>
    </div>
    <div>
      <dt th:text="#{city}">City</dt>
      <dd th:text="*{city}"></dd>
    </div>
    <div>
      <dt th:text="#{telephone}">Telephone</dt>
      <dd th:text="*{telephone}"></dd>
    </div>
  </dl>

  <h3 class="section-title" th:text="#{petsAndVisits}">Pets and Visits</h3>

  <p class="empty" th:if="${#lists.isEmpty(owner.pets)}" th:text="#{noPets}">No pets yet.</p>

  <article class="sheet pet" th:each="pet : ${owner.pets}">
    <header class="pet-head">
      <div>
        <h4 th:text="${pet.name}">Leo</h4>
        <p class="pet-meta">
          <span th:text="${#messages.msgOrNull('petType.' + pet.type) ?: pet.type}">cat</span>
          <span th:text="#{birthDate} + ' ' + ${#temporals.format(pet.birthDate, 'dd/MM/yyyy')}">Birth Date</span>
        </p>
      </div>
      <div class="button-row">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}"
          th:text="#{editPet}">Edit Pet</a>
        <a class="btn btn-sm btn-primary" th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}"
          th:text="#{addVisit}">Add Visit</a>
      </div>
    </header>
    <table class="table visits" th:unless="${#lists.isEmpty(pet.visits)}">
      <thead>
        <tr>
          <th th:text="#{visitDate}">Visit Date</th>
          <th th:text="#{description}">Description</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="visit : ${pet.visits}">
          <td class="nowrap" th:text="${#temporals.format(visit.date, 'dd/MM/yyyy')}"></td>
          <td th:text="${visit?.description}"></td>
        </tr>
      </tbody>
    </table>
    <p class="empty" th:if="${#lists.isEmpty(pet.visits)}" th:text="#{noVisits}">No visits yet.</p>
  </article>

  <script>
    setTimeout(function () {
      document.querySelectorAll(".flash").forEach(function (el) { el.remove(); });
    }, 4000);
  </script>

</body>

</html>
