<!DOCTYPE html>

<html th:fragment="layout (template, menu)" th:lang="${#locale.language}" xmlns:th="https://www.thymeleaf.org">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#34302d">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/site.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container site-nav-inner">
      <a class="navbar-brand" th:href="@{/}" th:title="#{home}"><span></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
        aria-controls="main-navbar" aria-expanded="false" th:aria-label="#{home}">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">

          <li th:fragment="menuItem (link,active,glyph,text)" class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}"
              th:attr="aria-current=${active==menu ? 'page' : null}">
              <span th:class="'fa fa-fw fa-'+${glyph}" class="fa fa-home" aria-hidden="true"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

        </ul>

        <ul class="navbar-nav ms-lg-auto">

          <li th:replace="~{::menuItem ('/','home','home',#{home})}">
            <span th:text="#{home}">Home</span>
          </li>

          <li th:replace="~{::menuItem ('/owners/find','owners','users',#{findOwners})}">
            <span th:text="#{findOwners}">Owners</span>
          </li>

          <li th:replace="~{::menuItem ('/vets.html','vets','user-md',#{vets})}">
            <span th:text="#{vets}">Veterinarians</span>
          </li>

          <li th:replace="~{::menuItem ('/painel','painel','graduation-cap',#{caseStudy})}">
            <span th:text="#{caseStudy}">Case study</span>
          </li>

          <li th:replace="~{::menuItem ('/oups','error','exclamation-triangle',#{error})}">
            <span th:text="#{error}">Error</span>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <main th:class="${menu == 'painel' ? 'container-fluid site-main site-main-wide' : 'container site-main'}">
    <th:block th:insert="${template}" />
  </main>

  <footer class="site-footer">
    <div class="container">
      <span th:text="#{footer}">Spring PetClinic</span>
      <img th:src="@{/resources/images/spring-logo.svg}" src="../static/images/spring-logo.svg" alt="Spring"
        class="site-footer-logo">
    </div>
  </footer>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
