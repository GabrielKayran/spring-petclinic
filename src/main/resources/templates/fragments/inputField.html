<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body>
  <form>
    <th:block th:fragment="input (label, name, type)">
      <div class="field">
        <label th:for="${name}" class="form-label" th:text="${label}">Label</label>
        <th:block th:switch="${type}">
          <input th:case="'text'" class="form-control" th:errorclass="is-invalid" type="text"
            th:field="*{__${name}__}" />
          <input th:case="'date'" class="form-control" th:errorclass="is-invalid" type="date"
            th:field="*{__${name}__}" th:min="${minVisitDate}" />
        </th:block>
        <div class="invalid-feedback" th:if="${#fields.hasErrors(name)}" th:errors="*{__${name}__}"
          th:text="#{error}">Error</div>
      </div>
    </th:block>
  </form>
</body>

</html>
