<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body>
  <form>
    <th:block th:fragment="select (label, name, items)">
      <div class="field">
        <label th:for="${name}" class="form-label" th:text="${label}">Label</label>
        <select class="form-select" th:errorclass="is-invalid" th:field="*{__${name}__}">
          <option th:each="item : ${items}" th:value="${item}"
            th:text="${#messages.msgOrNull('petType.' + item) ?: item}">dog</option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors(name)}" th:errors="*{__${name}__}"
          th:text="#{error}">Error</div>
      </div>
    </th:block>
  </form>
</body>

</html>
