# Configuração usada apenas nos testes. O Spring Boot carrega classpath:/config/application.properties
# depois de classpath:/application.properties, então só as chaves abaixo são sobrescritas.

# Extensão 1 (gRPC): vários contextos de teste ficam em cache ao mesmo tempo. Com a porta fixa 9090,
# o segundo contexto falharia com "Address already in use". A porta 0 escolhe uma porta livre.
spring.grpc.server.port=0
