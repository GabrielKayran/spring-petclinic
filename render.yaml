# Render Blueprint. Database credentials are not stored here: "sync: false" makes Render
# ask for them in the dashboard.
services:
  - type: web
    name: petclinic-poo2
    runtime: docker
    plan: free
    # Closest Render region to Neon's sa-east-1
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # jdbc:postgresql://HOST/neondb?sslmode=require&channelBinding=require
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASS
        sync: false
      # Do not expose /actuator/env, /actuator/heapdump, etc. in production
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: health,info
